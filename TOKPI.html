<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TOKPI STORE</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

  <h1>TOKPI STORE</h1>

  <label for="customerSelect">CUSTOMER:</label>
  <select id="customerSelect">
    <option value="">SELECT CUSTOMER</option>
  </select>
  <br><br>

  <label for="productSelect">PRODUCT NAME:</label>
  <select id="productSelect">
    <option value="">SELECT PRODUCT</option>
  </select>
  <br><br>

  <label for="quantity">QUANTITY:</label>
  <input type="number" id="quantity" min="1" value="1">
  <br><br>

  <p id="priceDisplay"><strong>Price : ₱0.00</strong></p>
  <p id="grossDisplay"><strong>Gross Amount : ₱0.00</strong></p>
  <p id="discountDisplay"><strong>Senior Discount : ₱0.00</strong></p>
  <p id="netDisplay"><strong>Net Amount : ₱0.00</strong></p>

  <script src="script.js"></script>
</body>
</html>
